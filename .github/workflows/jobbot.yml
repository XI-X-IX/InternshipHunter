name: JobBot

on:
  # Planification désactivée dans ce dépôt vitrine. Dans ta copie privée, décommente ces 3 lignes :
  # toutes les 30 min (hh:07 et hh:37), de 5h à 21h UTC = 6h à 22h en Suisse (hiver).
  # schedule:
  #   - cron: "7,37 5-21 * * *"
  workflow_dispatch: {}         # bouton « Run workflow » pour lancer à la main

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base des offres déjà envoyées est conservée entre deux exécutions
      - uses: actions/cache/restore@v4
        with:
          path: data/jobbot.db
          key: jobbot-db-${{ github.run_id }}
          restore-keys: jobbot-db-

      - name: Chercher les stages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m jobbot --once

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobbot.db
          key: jobbot-db-${{ github.run_id }}
